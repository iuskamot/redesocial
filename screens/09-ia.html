<!-- ============ Módulo Inteligência Artificial ============
     A conversa com a IA da rede. O cabeçalho é o mesmo dos outros módulos; o
     miolo é claro, com a coluna das conversas à esquerda e a conversa no meio.
     O compositor é UM só: fica no centro enquanto não há conversa e desce para
     o rodapé assim que a primeira pergunta é feita. -->
<div class="ia-view" id="iaView">

  <div class="nmod-top ia-top">

7.6 7.6c-.3.3-.2.7.1.9 1.3 1 3 2.1 5 3 8.4 4 21.9 4.7 29.4-.9 3.8-2.7 6-6.2 6.5-10.5.5-4.4-.7-8.5-3.7-12'/%3E %3C/svg%3E" alt="SULTS"></button>
    <span style="flex:1"></span>
    <button class="nmod-switch" id="iaManage"><i class="fa-solid fa-gear"></i><span class="lbl">Gerenciar</span></button>
    <button class="nmod-tab" id="iaApps"><i class="fa-solid fa-grip"></i> Módulos</button>
    <span class="avatar av-rc nmod-topav" id="iaTopAv" title="Rodrigo Caetano"></span>
  </div>

  <div class="ia-body">

    <!-- ---------- conversas ---------- -->
    <aside class="ia-side" id="iaSide">
      <button class="ia-new" id="iaNew"><i class="mdi mdi-square-edit-outline"></i> Nova conversa</button>
      <nav class="ia-nav">
        <button type="button" class="ia-item on" id="iaTodasBtn">
          <i class="mdi mdi-forum-outline ia-ic-off"></i><i class="mdi mdi-forum ia-ic-on"></i><span>Conversas</span>
        </button>
        <button type="button" class="ia-item" id="iaArqBtn">
          <i class="mdi mdi-archive-outline ia-ic-off"></i><i class="mdi mdi-archive ia-ic-on"></i><span>Arquivadas</span>
        </button>
      </nav>
      <div class="ia-find">
        <i class="mdi mdi-magnify"></i>
        <input type="text" id="iaFind" placeholder="Buscar conversa" autocomplete="off">
      </div>
      <div class="ia-list" id="iaList"></div>

      <div class="ia-sidefoot">
        <div class="ia-userwrap">
          <button type="button" class="ia-user" id="iaUser" aria-haspopup="menu" aria-expanded="false">
            <span class="avatar av-rc ia-userav"></span>
            <span class="ia-user-tx"><b id="iaUserNome">Rodrigo Caetano</b><span id="iaUserSub">CEO · SULTS</span></span>
            <i class="mdi mdi-chevron-down"></i>
          </button>
          <div class="ia-usermenu" id="iaUserMenu" role="menu" hidden></div>
        </div>
      </div>
    </aside>

    <!-- ---------- a conversa ---------- -->
    <main class="ia-main">

      <div class="ia-head" id="iaHead" hidden>
        <span class="ia-head-tt" id="iaHeadTt"></span>
        <span style="flex:1"></span>
        <button class="ia-hbtn ia-hbtn-tx" id="iaShare" title="Compartilhar conversa"><i class="mdi mdi-export-variant"></i><span>Compartilhar</span></button>
        <div class="ia-menuwrap">
          <button class="ia-hbtn" id="iaMore" title="Mais ações"><i class="mdi mdi-dots-horizontal"></i></button>
          <div class="ia-menu" id="iaMenu" hidden>
            <button type="button" data-iam="renomear"><i class="mdi mdi-pencil-outline"></i> Renomear</button>
            <button type="button" data-iam="arquivar"><i class="mdi mdi-archive-arrow-down-outline"></i> Arquivar</button>
            <button type="button" class="danger" data-iam="excluir"><i class="mdi mdi-trash-can-outline"></i> Excluir</button>
          </div>
        </div>
      </div>

      <div class="ia-scroll" id="iaScroll">

        <!-- sem conversa: saudação, compositor no meio e sugestões -->
        <section class="ia-zero" id="iaZero">
          <h1 class="ia-hello" id="iaHello">Boa tarde, Rodrigo</h1>
          <p class="ia-sub">No que posso te ajudar hoje?</p>
          <div class="ia-zerodock" id="iaZeroDock"></div>
          <div class="ia-chips" id="iaChips"></div>
        </section>

        <!-- com conversa: as mensagens -->
        <section class="ia-thread" id="iaThread" hidden></section>

      </div>

      <div class="ia-dock" id="iaDock" hidden></div>
    </main>
  </div>

  <!-- o menu de cada conversa: mora fora da coluna, que corta o que passa
       das bordas, e é posicionado na hora do clique -->
  <div class="ia-menu ia-rowmenu" id="iaRowMenu" hidden>
    <button type="button" data-iar="renomear"><i class="mdi mdi-pencil-outline"></i> Renomear</button>
    <button type="button" data-iar="arquivar"><i class="mdi mdi-archive-arrow-down-outline"></i> Arquivar</button>
    <button type="button" class="danger" data-iar="excluir"><i class="mdi mdi-trash-can-outline"></i> Excluir</button>
  </div>

  <!-- o compositor, que troca de lugar entre o centro e o rodapé -->
  <div class="ia-comp" id="iaComp">
    <div class="ia-compbox" id="iaCompBox">
      <label class="sr-only" for="iaText">Sua pergunta</label>
      <textarea class="ia-text" id="iaText" rows="1" placeholder="Pergunte alguma coisa sobre a rede…" autocomplete="off"></textarea>
      <div class="ia-comprow" id="iaCompRow">
        <button type="button" class="ia-cbtn" id="iaAttach" title="Anexar arquivo"><i class="mdi mdi-paperclip"></i></button>
        <span style="flex:1"></span>
        <button type="button" class="ia-cbtn" id="iaMic" title="Ditar" aria-label="Ditar"><i class="mdi mdi-microphone-outline"></i></button>
        <button type="button" class="ia-send" id="iaSend" disabled aria-label="Enviar pergunta"><i class="mdi mdi-arrow-up"></i></button>
      </div>

      <!-- gravando: cancelar, a onda do que está entrando, pausar e concluir.
           Ao concluir, a onda dá lugar ao "Transcrevendo…" enquanto o
           reconhecimento fecha o que ficou pendente. -->
      <div class="ia-rec" id="iaRec" hidden>
        <button type="button" class="ia-recx" id="iaRecCancel" title="Cancelar" aria-label="Cancelar a gravação"><i class="mdi mdi-close"></i></button>
        <canvas class="ia-recwave" id="iaRecWave" aria-hidden="true"></canvas>
        <span class="ia-recload" aria-live="polite"><span class="ia-recspin" aria-hidden="true"></span>Transcrevendo…</span>
        <button type="button" class="ia-recpause" id="iaRecPause" title="Pausar" aria-label="Pausar a gravação"><i class="mdi mdi-pause"></i></button>
        <button type="button" class="ia-recok" id="iaRecOk" title="Concluir" aria-label="Concluir a gravação"><i class="mdi mdi-arrow-up"></i></button>
      </div>
    </div>
    <p class="ia-disc">A IA responde a partir dos documentos da sua rede e pode cometer erros. Confira o que for decisivo.</p>
  </div>

</div>
