<!-- header, perfil de pessoa, editor de imagem -->
<div class="main">

  <header class="topbar">
    <!-- só aparece no mobile, onde a busca e as ações saem do header -->

/%3E %3C/svg%3E" alt="SULTS">
    <!-- so na home customizavel: a logo do cliente, no celular -->
    <span class="top-logo-cliente" hidden><img src="uploads/crunch/logo.webp" alt="Crunchyroll"></span>
    <div class="top-search" id="gsBox">
      <span class="gs-spark" aria-hidden="true"></span>
      <input type="text" id="gsInput" placeholder="No que vamos trabalhar?" autocomplete="off">
      <span class="gs-kbd">Ctrl K</span>
      <div class="gs-panel" id="gsPanel" hidden></div>
    </div>
    <div class="top-actions">
      <div class="newbtn-wrap" id="newWrap">
        <button class="newbtn" id="newBtn" aria-haspopup="menu" aria-expanded="false">
          <i class="fa-solid fa-plus"></i><span class="newbtn-label">Ações Rápidas</span><span class="gs-kbd newbtn-kbd">N</span>
        </button>
        <div class="new-menu" id="newMenu" role="menu" hidden></div>
      </div>
      <span class="top-sep"></span>
      <button class="user-chip" id="topUserChip">
        <span class="avatar av-rc">RC</span>
        <span class="uname">Rodrigo</span>
        <i class="fa-solid fa-chevron-down"></i>
      </button>
    </div>
  </header>

  <div class="new-sheet-backdrop" id="newSheetBd" hidden></div>
  <div class="toast-wrap" id="toastWrap"></div>
  <div class="pp-view" id="personProfile" hidden>
    <div class="pp-top">
      <button class="pp-toplogo" id="ppBack" title="Voltar">
        <svg class="pp-logomark" viewBox="0 0 76.6 76.6" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="M59.4 28.2 28.2 59.4c-.4.4-1.2.4-1.6 0L17.2 50c-.4-.4-.4-1.2 0-1.6l31.2-31.2c.4-.4 1.2-.4 1.6 0l9.3 9.3c.4.4.4 1.1 0 1.7z"/><path fill="currentColor" d="M32.6.2 5.5 27.4c-3 3-3 7.9 0 10.9l5 5c.2.2.6.2.9 0L53.6 1.1C54 .7 53.8 0 53.2 0H33.1c-.2 0-.3.1-.5.2z"/><path fill="currentColor" d="M65.2 33.3 22.9 75.5c-.4.4-.1 1.1.4 1.1h20.1c.2 0 .3-.1.4-.2l27.2-27.2c3-3 3-7.9 0-10.9l-5-5c-.3-.3-.7-.3-.9 0z"/></svg>
        <span class="pp-logoword">SULTS</span>
        <!-- so na home customizavel: a logo do cliente no lugar da do SULTS -->
        <img class="pp-logo-cliente" alt="" hidden>
      </button>
      <span style="flex:1"></span>
      <button class="pp-topic" id="ppTopApps" title="Módulos"><i class="fa-solid fa-grip"></i><span class="pp-topic-lbl">Módulos</span></button>
      <button class="user-chip pp-topchip" id="ppTopUser"><span class="avatar av-rc pp-topav"></span><span class="uname">Rodrigo</span><i class="fa-solid fa-chevron-down"></i></button>
    </div>
    <div class="pp-scroll">
      <div class="pp-hero-card">
        <div class="pp-cover" id="ppCover"><span class="pp-cover-pat"></span><!-- so na home customizavel: o mesmo Trocar capa do cartao da home --><button type="button" class="capa-trocar" id="ppCapaTrocar" hidden><i class="fa-solid fa-camera"></i> Trocar capa</button></div>
        <div class="pp-hero-in">
          <div class="pp-avwrap"><div class="pp-avatar avatar" id="ppAvatar"><span class="pp-online"></span></div><button class="pp-avedit" id="ppAvEdit" title="Alterar foto do perfil"><i class="fa-solid fa-camera"></i></button></div>
          <div class="pp-hero-main">
            <div class="pp-name" id="ppName"></div>
            <div class="pp-role" id="ppRole"></div>
            <div class="pp-metaline" id="ppMeta"></div>
            <div class="pp-heroend">
            <div class="pp-stats" id="ppStats"></div>
            <div class="pp-actions"><button class="pp-btn primary" id="ppConnect"><i class="fa-solid fa-user-plus"></i> Conectar a uma nova marca</button><button class="pp-btn" id="ppEdit"><i class="fa-solid fa-key"></i> Alterar senha</button><div class="pp-morewrap"><button class="pp-btn icon" id="ppMore"><i class="fa-solid fa-ellipsis"></i></button>
              <div class="pp-moremenu" id="ppMoreMenu" hidden>
                <button data-ppmenu="termos"><i class="fa-solid fa-file-lines"></i> Meus termos</button>
                <button class="danger" data-ppmenu="sair"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
              </div></div></div>
            </div>
          </div>
        </div>
      </div>
      <div class="pp-grid">
        <div class="pp-col">
          <div class="pp-card"><div class="pp-sec">Vínculos</div><div class="pp-links" id="ppLinks"></div></div>
          <div class="pp-card"><div class="pp-sec">Informações</div><div class="pp-info" id="ppInfo"></div></div>
          <div class="pp-card"><div class="pp-sec">Dados básicos</div><div class="pp-fields" id="ppBasic"></div></div>
          <div class="pp-card"><div class="pp-sec">Endereço</div><div class="pp-fields" id="ppAddr"></div></div>
          <div class="pp-card"><div class="pp-sec">Documentos</div><div class="pp-docs" id="ppDocs"></div></div>
        </div>
        <div class="pp-col pp-rail">
          <div class="pp-card pp-menucard">
            <button class="pp-menuitem" data-ppmenu="seguranca"><i class="fa-solid fa-shield-halved"></i><span>Segurança</span><i class="fa-solid fa-chevron-right pp-mchev"></i></button>
            <button class="pp-menuitem" data-ppmenu="termos"><i class="fa-solid fa-file-lines"></i><span>Meus termos</span><i class="fa-solid fa-chevron-right pp-mchev"></i></button>
            <button class="pp-menuitem danger" data-ppmenu="sair"><i class="fa-solid fa-right-from-bracket"></i><span>Sair</span><i class="fa-solid fa-chevron-right pp-mchev"></i></button>
          </div>
          <!-- a mesma marca do rodape do menu, aqui em cinza, fora do cartao -->
          <div class="pp-sults">
            <span class="pp-sults-por">Desenvolvido por <img src="uploads/pacote_logotipos_sults/png/sults-logo-horizontal-branco.png" alt="SULTS"></span>
            <span class="pp-sults-dir">© 2018 Todos os direitos reservados</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Recorte da foto e da capa: o mesmo modal serve aos dois, mudando so a
       proporcao da janela (circulo para a foto, faixa para a capa). A imagem
       arrasta por baixo da janela e a barra aproxima. -->
  <div class="fg-backdrop" id="ppAvModal">
    <div class="fg-modal" style="width:min(720px,94vw)">
      <div class="fg-head" style="gap:10px">
        <h2 id="ppAvTitulo">Foto do perfil</h2>
        <span style="flex:1"></span>
        <button class="fg-close" id="ppAvClose"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="fg-body">
        <div class="ppav-stage" id="ppAvStage">
          <span class="ppav-empty"><i class="fa-solid fa-image"></i> Nenhuma imagem selecionada</span>
        </div>
        <div class="ppav-zoom" id="ppAvZoomWrap" hidden>
          <i class="fa-solid fa-magnifying-glass-minus"></i>
          <input type="range" id="ppAvZoom" min="100" max="300" step="1" value="100" aria-label="Aproximar">
          <i class="fa-solid fa-magnifying-glass-plus"></i>
        </div>
        <div class="ppav-acoes">
          <button type="button" class="pp-btn" id="ppAvPick"><i class="fa-solid fa-upload"></i> Escolher arquivo</button>
          <button type="button" class="pp-btn" id="ppAvRemove"><i class="fa-solid fa-trash-can"></i> Remover</button>
          <span style="flex:1"></span>
          <button type="button" class="pp-btn primary" id="ppAvSalvar"><i class="fa-solid fa-check"></i> Selecionar</button>
        </div>
      </div>
      <input type="file" id="ppAvFile" accept="image/*" hidden>
    </div>
  </div>
  <div class="fg-backdrop" id="rejModal">
    <div class="fg-modal" style="width:460px">
      <div class="fg-head"><h2>Motivo da recusa</h2><span style="flex:1"></span><button class="fg-close" id="rejClose"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="fg-body">
        <label class="fg-label">Explique o motivo da recusa</label>
        <textarea id="rejText" class="fg-input" style="min-height:110px;resize:vertical" placeholder="Escreva o motivo que será registrado..."></textarea>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px">
          <button class="fo-btn ghost" id="rejCancel">Cancelar</button>
          <button class="fo-btn" id="rejConfirm" style="background:#e0392c"><i class="fa-solid fa-xmark"></i> Recusar</button>
        </div>
      </div>
    </div>
  </div>
  <div class="img-lightbox" id="imgLightbox" hidden>
    <button class="ilb-close" id="ilbClose"><i class="fa-solid fa-xmark"></i></button>
    <button class="ilb-nav prev" id="ilbPrev"><i class="fa-solid fa-chevron-left"></i></button>
    <img id="ilbImg" alt="">
    <button class="ilb-nav next" id="ilbNext"><i class="fa-solid fa-chevron-right"></i></button>
    <div class="ilb-count" id="ilbCount"></div>
  </div>
  <div class="img-editor" id="imgEditor" hidden>
    <div class="ie-modal">
      <div class="ie-head"><h2>Editor</h2><button class="ie-close" id="ieClose"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="ie-body">
        <div class="ie-main"><img id="ieMain" alt=""></div>
        <div class="ie-side">
          <div class="ie-count" id="ieCount"></div>
          <div class="ie-thumbs" id="ieThumbs"></div>
          <div class="ie-tools"><button id="ieDup" title="Duplicar"><i class="fa-regular fa-copy"></i></button><button id="ieDel" title="Excluir"><i class="fa-regular fa-trash-can"></i></button><button id="ieAdd" title="Adicionar" class="round"><i class="fa-solid fa-plus"></i></button></div>
        </div>
      </div>
      <div class="ie-foot"><button class="nv-wbtn primary" id="ieDone">Avançar</button></div>
      <input type="file" id="ieFile" accept="image/*" multiple hidden>
    </div>
  </div>

  <button class="demo-toggle" id="demoToggle" title="Alternar entre conteúdo preenchido e vazio (demo para devs)">
    <i class="fa-solid fa-flask"></i>
    <span class="dt-label">Conteúdo:</span>
    <span class="dt-state" id="demoState">Preenchido</span>
  </button>
